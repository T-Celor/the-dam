name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: dam
        run: cargo test --locked
      - name: Lint
        working-directory: dam
        run: cargo clippy --locked --all-targets
      - name: Build
        working-directory: dam
        run: cargo build --release --locked
      # `cargo test` also runs dam/tests: the programs end to end, and the Codex and Copilot packaging.
      - name: Codex and Copilot files are current
        working-directory: dam
        run: ./target/release/dam hosts --check
