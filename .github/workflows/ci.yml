name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: dam
        run: cargo test --locked
      - name: Lint
        working-directory: dam
        run: cargo clippy --locked --all-targets
      - name: Build
        working-directory: dam
        run: cargo build --release --locked
      - name: Run the programs end to end
        shell: bash
        run: sh scripts/smoke.sh
      - name: Codex and Copilot packaging
        run: node --test scripts/hosts.test.mjs
