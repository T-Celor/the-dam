name: Build programs

# The plugin ships a build for each system, so that nobody needs a Rust toolchain to install it.
on:
  push:
    branches: [main]
    paths: ['dam/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, folder: windows-x64, ext: .exe }
          - { os: ubuntu-latest, folder: linux-x64, ext: '' }
          - { os: ubuntu-24.04-arm, folder: linux-arm64, ext: '' }
          - { os: macos-latest, folder: macos-arm64, ext: '' }
          - { os: macos-latest, folder: macos-x64, ext: '', target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: dam
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            cargo build --release --locked --target "${{ matrix.target }}"
            cp target/${{ matrix.target }}/release/dam-* target/release/ 2>/dev/null || { mkdir -p target/release; cp target/${{ matrix.target }}/release/dam-* target/release/; }
          else
            cargo build --release --locked
          fi
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for name in dam-squeeze dam-graph dam-beaver dam-economizer; do
            cp "dam/target/release/$name${{ matrix.ext }}" out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.folder }}
          path: out/

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Commit what changed
        run: |
          for folder in built/*; do
            mkdir -p "bin/$(basename "$folder")"
            cp "$folder"/* "bin/$(basename "$folder")/"
          done
          chmod +x bin/*/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          git diff --cached --quiet || git commit -m "Build programs [skip ci]"
          git push
