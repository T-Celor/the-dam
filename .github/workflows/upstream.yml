name: Upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the projects the dam builds on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./bin/linux-x64/dam upstream --check | tee upstream.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
          open=$(gh issue list --state open --search "Upstream moved in:title" --json number --jq length)
          [ "$open" -gt 0 ] && exit 0
          gh issue create --title "Upstream moved" --body "$(printf 'Run `dam upstream`, port what matters, then `dam upstream pin NAME`.\n\n```\n%s\n```' "$(cat upstream.txt)")"
