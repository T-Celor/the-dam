[package]
name = "dam"
version = "0.1.0"
edition = "2021"
description = "Condenses command output without loss and builds a code graph, all locally."

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies]
fancy-regex = "0.13"
md5 = "0.7"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
