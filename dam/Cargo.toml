[package]
name = "dam"
version = "0.31.3"
edition = "2021"
description = "Lossless output compression, a local code graph and agent hooks for Claude Code."
license-file = "../LICENSE"
repository = "https://github.com/T-Celor/the-dam"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dependencies]
fancy-regex = "0.13"
md5 = "0.7"
sha1_smol = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
